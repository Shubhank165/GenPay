name: genpay
description: "GenPay - A Paytm Clone Super App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  carousel_slider: ^5.0.0
  percent_indicator: ^4.2.3
  pin_code_fields: ^8.0.1
  fl_chart: ^0.69.2
  smooth_page_indicator: ^1.2.0+3
  http: ^1.2.2
  flutter_secure_storage: ^9.0.0
  record: ^6.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
